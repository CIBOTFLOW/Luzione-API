{
  "openapi": "3.1.0",
  "info": {
    "title": "Luzione API Read-Only Foundation",
    "version": "0.1.0",
    "description": "Additive Wave 0 contract. Mutation authority remains disabled by default."
  },
  "servers": [
    { "url": "https://api.luzione.com", "description": "Production hostname; deployment evidence is evaluated separately." }
  ],
  "paths": {
    "/api/v1/release": {
      "get": {
        "operationId": "getReleaseIdentity",
        "summary": "Read exact release, schema and contract identity",
        "responses": { "200": { "description": "Release identity observation" } }
      }
    },
    "/api/v1/livez": {
      "get": {
        "operationId": "getLiveness",
        "summary": "Read process liveness",
        "responses": { "200": { "description": "Process is live" } }
      }
    },
    "/api/v1/readyz": {
      "get": {
        "operationId": "getDependencyReadiness",
        "summary": "Read dependency readiness",
        "responses": {
          "200": { "description": "Dependencies are ready" },
          "503": { "description": "Dependency readiness is not proven" }
        }
      }
    },
    "/api/v1/healthz": {
      "get": {
        "operationId": "getSecurityReadiness",
        "summary": "Read security and RLS readiness evidence",
        "responses": {
          "200": { "description": "Security readiness is proven for the current observation" },
          "503": { "description": "Security readiness is not proven" }
        }
      }
    },
    "/api/v1/catalog": {
      "get": {
        "operationId": "getContractCatalog",
        "summary": "Read API-owned contract, source-of-truth and table-object registries",
        "responses": { "200": { "description": "Bounded catalog metadata" } }
      }
    },
    "/api/v1/commands/quotes": {
      "get": { "operationId": "getQuote", "summary": "Read a tenant-bound canonical Quote and immutable economics", "responses": { "200": { "description": "Quote readback" }, "404": { "description": "Quote not found" } } },
      "post": { "operationId": "createQuote", "summary": "Create a default-off canonical Quote and immutable economics version", "responses": { "201": { "description": "Quote committed with P110 receipt" }, "409": { "description": "Version or idempotency conflict" }, "503": { "description": "Mutation path disabled or unavailable" } } }
    },
    "/api/v1/commands/quote-approvals": {
      "get": { "operationId": "getQuoteApproval", "summary": "Read an exact-version Quote margin decision", "responses": { "200": { "description": "Quote approval readback" }, "404": { "description": "Quote not found" } } },
      "post": { "operationId": "decideQuoteMarginApproval", "summary": "Record a credential-bound human decision for exact Quote economics", "responses": { "200": { "description": "Decision committed with P110 receipt" }, "403": { "description": "Human or role authority denied" }, "409": { "description": "Version or decision conflict" }, "503": { "description": "Mutation path disabled or unavailable" } } }
    },
    "/api/v1/commands/proposal-reviews": {
      "get": { "operationId": "getProposalReview", "summary": "Read the latest exact-version Proposal review", "responses": { "200": { "description": "Proposal review readback" }, "404": { "description": "Proposal review not found" } } },
      "post": { "operationId": "decideProposalReview", "summary": "Record a credential-bound human review for the exact current Proposal artifact", "responses": { "201": { "description": "Review committed with P110 receipt" }, "403": { "description": "Human, role, or typed-confirmation authority denied" }, "409": { "description": "Version or blocker conflict" }, "503": { "description": "Mutation path disabled or unavailable" } } }
    },
    "/api/v1/commands/orders": {
      "get": { "operationId": "getOrder", "summary": "Read a tenant-bound canonical Order", "responses": { "200": { "description": "Order readback" }, "404": { "description": "Order not found" } } },
      "post": { "operationId": "createOrderFromAcceptedQuote", "summary": "Create a default-off Order from an exact customer-accepted Quote", "responses": { "201": { "description": "Order committed with P110 receipt" }, "409": { "description": "Acceptance, version, approval or duplicate conflict" }, "503": { "description": "Mutation path disabled or unavailable" } } }
    },
    "/api/v1/commands/fulfillment-intents": {
      "get": { "operationId": "getFulfillmentIntent", "summary": "Read a bounded no-effect Fulfillment Intent", "responses": { "200": { "description": "Fulfillment Intent readback" }, "404": { "description": "Intent not found" } } },
      "post": { "operationId": "requestFulfillmentIntent", "summary": "Record a no-effect intent for the exact current Order", "responses": { "201": { "description": "Intent committed with P110 receipt" }, "409": { "description": "Order version or line conflict" }, "503": { "description": "Mutation path disabled or unavailable" } } }
    },
    "/api/v1/provider-operations": {
      "get": { "operationId": "getProviderOperations", "summary": "Read tenant-bound provider worker, reconciliation, dead-letter and kill-switch aggregates", "responses": { "200": { "description": "Bounded provider operations readback" }, "401": { "description": "Service authentication required" }, "503": { "description": "Readback unavailable" } } }
    },
    "/api/v1/sultan/agent-intents/evaluate": {
      "post": {
        "operationId": "evaluateSultanAgentIntent",
        "summary": "Evaluate a credential-bound Sultan agent intent without mutating business state",
        "responses": {
          "200": { "description": "Read-only or simulation-only policy decision" },
          "400": { "description": "Invalid exact-version agent intent" },
          "401": { "description": "Credential or capability authentication failed" },
          "403": { "description": "Caller attempted to supply authority" },
          "422": { "description": "Agent intent failed the deterministic authority boundary" },
          "503": { "description": "Evaluation boundary unavailable" }
        }
      }
    }
  }
}
